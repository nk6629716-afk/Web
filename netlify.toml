# Netlify configuration for Relay Frontend
[build]
  base       = "."
  command    = "npm install && npm run build --workspace=packages/shared && npm run build --workspace=packages/engine && npm run build --workspace=apps/web"
  publish    = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API requests directly to Render backend
[[redirects]]
  from   = "/api/*"
  to     = "https://relay-api-bo0p.onrender.com/api/:splat"
  status = 200
  force  = true

# Proxy Socket.IO requests directly to Render backend
[[redirects]]
  from   = "/socket.io/*"
  to     = "https://relay-api-bo0p.onrender.com/socket.io/:splat"
  status = 200
  force  = true

# SPA routing — all paths go to index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
